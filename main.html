<!DOCTYPE html>
<html lang="sve">
    <head>
        <!-- <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0"> -->
        <link rel="stylesheet" href="style.css">
        <style> @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..900;1,400..900&display=swap');
</style>
        <title>Blackjack</title>
    </head>
    <body>
        <header>
            <h1>Blackjack</h1>
            <p>Get your cards. make your move</p>
        </header>
        <main>
            <div>
                <p>Dealers hand: </p>
                <div class="dealers">
                    <p>card1</p>
                    <p>card2</p>
                </div>
                <p class="dealer-sum">sum: ?</p>
            </div>
            <div>
                <p>Your hand: </p>
                <div class="players">
                    <p>card1</p>
                    <p>card2</p>
                </div>
                <p class="player-sum">Your sum: </p>
            </div>
        </main>
        <footer>
            <h1>What will you do next?</h1>
            <button>
                <h1>Play</h1>
                <p>
                    Start a new Game
                </p>
            </button>
            <button>
                <h1>Hit</h1>
                <p>
                    Draw a Card
                </p>
            </button>
            <button>
                <h1>Stand</h1>
                <p>
                    Keep your hand
                </p>
            </button>
        </footer>
    <script src="index.js"></script>    
    </body>
</html>
