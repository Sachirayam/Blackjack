<!DOCTYPE html>
<html lang="swe">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="style.css">
        <title>Blackjack</title>
    </head>
    <body>
        <header>
            <div class="top-bar">
                <p id="bankroll" class="bankroll">Credits: <strong> </strong></p>
                <h1>Blackjack</h1>
            </div>
            <p id="game-message" class="game-message" aria-live="polite">Get your cards. Make your move.</p>
        </header>
        <main>
            <section class="table" aria-label="Blackjack table">
                <section class="hand dealer-hand" aria-labelledby="dealer-title">
                    <div class="hand-heading">
                        <h2 id="dealer-title">Dealer's hand</h2>
                        <span class="hand-status">House</span>
                    </div>
                    <div class="cards dealers">
                        <p id="dealer-cards">Cards waiting</p>
                    </div>
                    <p id="dealer-sum" class="hand-sum dealer-sum">Sum: ?</p>
                </section>

                <section class="hand player-hand" aria-labelledby="player-title">
                    <div class="hand-heading">
                        <h2 id="player-title">Your hand</h2>
                        <span id="player-name" class="hand-status">Player</span>
                    </div>
                    <div class="cards players">
                        <p id="player-cards">Cards waiting</p>
                    </div>
                    <p id="player-sum" class="hand-sum player-sum">Sum: ?</p>
                </section>
            </section>
        </main>
        <footer>
            <section class="controls" aria-labelledby="controls-title">
                <h2 id="controls-title">Choose your move</h2>
                <div class="button-group">
                    <button type="button" class="action-button primary" onclick="startGame()">
                        <span class="button-title">Play</span>
                        <span class="button-description">Start a new game</span>
                    </button>
                    <button type="button" class="action-button" onclick="hit()">
                        <span class="button-title">Hit</span>
                        <span class="button-description">Draw another card</span>
                    </button>
                    <button type="button" class="action-button" onclick="stand()">
                        <span class="button-title">Stand</span>
                        <span class="button-description">Keep your hand</span>
                    </button>
                </div>
            </section>
        </footer>
        <script src="index.js"></script>
    </body>
</html>
